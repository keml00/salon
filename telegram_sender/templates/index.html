<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Telegram Salon Messenger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            color: #e94560;
            margin-bottom: 8px;
        }
        .header p {
            color: #a0a0b0;
            font-size: 14px;
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(5px);
        }
        .card label {
            display: block;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* Inputs */
        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(13, 27, 42, 0.8);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #e94560;
        }
        textarea {
            min-height: 140px;
            resize: vertical;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder {
            color: #555;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 150px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-send { background: #e94560; color: #fff; }
        .btn-send:hover { background: #d63851; }

        .btn-format { background: #00d2d3; color: #000; }
        .btn-format:hover { background: #00b8b8; }

        .btn-history { background: #0f3460; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-history:hover { background: #1a4a7a; }

        /* Status */
        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #a0a0b0;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.success { color: #00d2d3; }
        .status.error { color: #e94560; }
        .status.loading { color: #feca57; }

        /* History Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #16213e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h2 {
            color: #00d2d3;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #e94560;
            font-size: 24px;
            cursor: pointer;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #0f3460;
        }
        .history-item .time { color: #888; font-size: 12px; }
        .history-item .recipient { color: #e94560; font-weight: 600; }
        .history-item .text { color: #ccc; margin-top: 4px; font-size: 13px; }
        .history-item .status-tag { font-size: 11px; color: #00d2d3; }
        .history-item .status-tag.err { color: #e94560; }

        .export-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-export {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0f3460;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-export:hover { background: #1a4a7a; }

        .empty-state { text-align: center; color: #666; padding: 40px; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>✈️ Telegram Salon Messenger</h1>
        <p>Отправляй сообщения клиентам без сохранения номера</p>
    </div>

    <!-- Recipient -->
    <div class="card">
        <label>📱 Получатель (номер или @username)</label>
        <input type="text" id="recipient" placeholder="+79991234567 или @username">
    </div>

    <!-- Message -->
    <div class="card">
        <label>💬 Сообщение</label>
        <textarea id="message" placeholder="Введите текст сообщения..."></textarea>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
        <button class="btn btn-send" id="btnSend" onclick="sendMessage()">
            🚀 Отправить
        </button>
        <button class="btn btn-format" id="btnFormat" onclick="formatText()">
            ✨ Форматировать AI
        </button>
        <button class="btn btn-history" onclick="showHistory()">
            📋 История
        </button>
    </div>

    <!-- Status -->
    <div class="status" id="status">Готово к отправке</div>

    <!-- Footer -->
    <div class="footer">by keml00, Telegram</div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
    <div class="modal">
        <button class="modal-close" onclick="closeHistory()">✕</button>
        <h2>📋 История сообщений</h2>
        <div id="historyList"></div>
        <div class="export-row">
            <a href="/export/csv" class="btn-export">💾 Скачать CSV</a>
            <a href="/export/json" class="btn-export">💾 Скачать JSON</a>
        </div>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');

    function setStatus(text, type = '') {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
    }

    // Send message
    async function sendMessage() {
        const recipient = document.getElementById('recipient').value.trim();
        const text = document.getElementById('message').value.trim();

        if (!recipient) { setStatus('❌ Укажите получателя!', 'error'); return; }
        if (!text) { setStatus('❌ Введите сообщение!', 'error'); return; }

        const btn = document.getElementById('btnSend');
        btn.disabled = true;
        setStatus('⏳ Отправка...', 'loading');

        try {
            const res = await fetch('/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({recipient, text})
            });
            const data = await res.json();

            if (data.success) {
                setStatus('✅ Сообщение отправлено!', 'success');
                document.getElementById('message').value = '';
            } else {
                setStatus('❌ ' + data.error, 'error');
            }
        } catch (e) {
            setStatus('❌ Ошибка сети: ' + e.message, 'error');
        }
        btn.disabled = false;
    }

    // AI Format
    async function formatText() {
        const textarea = document.getElementById('message');
        const text = textarea.value.trim();

        if (!text) { setStatus('❌ Нечего форматировать!', 'error'); return; }

        const btn = document.getElementById('btnFormat');
        btn.disabled = true;
        setStatus('🤖 AI обрабатывает текст...', 'loading');

        try {
            const res = await fetch('/format', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();

            if (data.success) {
                textarea.value = data.text;
                setStatus('✨ Текст улучшен AI!', 'success');
            } else {
                setStatus('❌ ' + data.error, 'error');
            }
        } catch (e) {
            setStatus('❌ Ошибка: ' + e.message, 'error');
        }
        btn.disabled = false;
    }

    // History
    async function showHistory() {
        document.getElementById('historyModal').classList.add('active');
        const list = document.getElementById('historyList');
        list.innerHTML = '<p style="color:#888">Загрузка...</p>';

        try {
            const res = await fetch('/history');
            const data = await res.json();

            if (!data.length) {
                list.innerHTML = '<div class="empty-state">📭 История пуста</div>';
                return;
            }

            list.innerHTML = data.reverse().map(m => `
                <div class="history-item">
                    <span class="time">${m.timestamp.slice(0,16).replace('T',' ')}</span>
                    <span class="recipient"> → ${m.recipient}</span>
                    <span class="status-tag ${m.status !== 'sent' ? 'err' : ''}">[${m.status}]</span>
                    <div class="text">${m.text.length > 150 ? m.text.slice(0,150) + '...' : m.text}</div>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = '<p style="color:#e94560">Ошибка загрузки</p>';
        }
    }

    function closeHistory() {
        document.getElementById('historyModal').classList.remove('active');
    }

    // Close modal on overlay click
    document.getElementById('historyModal').addEventListener('click', function(e) {
        if (e.target === this) closeHistory();
    });

    // Ctrl+Enter to send
    document.getElementById('message').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
